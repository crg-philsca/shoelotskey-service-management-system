<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoelotskey 404 </title>
    <link rel="icon" type="image/png" href="/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .shoe-walk {
            animation: shoeWalk 1.8s ease-in-out infinite;
            transform-origin: 50% 85%;
        }
        @keyframes shoeWalk {
            0%   { transform: translateY(0px)   rotate(0deg);  }
            15%  { transform: translateY(-8px)  rotate(-5deg); }
            30%  { transform: translateY(-18px) rotate(-10deg);}
            50%  { transform: translateY(-22px) rotate(-8deg); }
            65%  { transform: translateY(-10px) rotate(-3deg); }
            80%  { transform: translateY(-2px)  rotate(2deg);  }
            90%  { transform: translateY(2px)   rotate(1deg);  }
            100% { transform: translateY(0px)   rotate(0deg);  }
        }
    </style>
</head>
<body class="bg-white flex flex-col min-h-screen">
    <!-- Main Content with balanced padding -->
    <div class="flex-grow flex flex-col items-center justify-center text-center px-4 py-12">
        <!-- Branded 3D Sneaker with Walking Animation & Seamless Multiply Blending -->
        <div class="mb-8 shoe-walk flex items-center justify-center">
            <img src="/static/branded_shoe_404.png" style="mix-blend-mode: multiply; filter: contrast(1.15) brightness(1.06);" alt="Shoelotskey 404" 
                 class="h-64 w-auto mx-auto select-none block border-none outline-none" />
        </div>
        
        <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">Oops! Page needs a shine.</h1>
        
        <p class="text-xl text-gray-600 mb-10 max-w-lg leading-relaxed font-medium">
            We couldn't find the page you're looking for. It might have been moved, deleted, or perhaps it's just getting a basic cleaning. Let's get you back to the login page!
        </p>

        <div class="flex flex-col items-center">
            <!-- Shoelotskey Brand Red Button -->
            <a href="/" class="inline-flex items-center justify-center bg-[#dc2626] hover:bg-[#b91c1c] text-white font-black py-4 px-10 rounded-2xl shadow-xl transform transition hover:-translate-y-1 active:scale-95 duration-200 uppercase tracking-widest text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                    <polyline points="10 17 15 12 10 7"/>
                    <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
                Back to Login
            </a>
        </div>

        <p class="mt-16 text-sm text-gray-400 italic font-medium">
            "Good shoes take you to great places... but this link doesn't!"
        </p>
    </div>
</body>
</html>
