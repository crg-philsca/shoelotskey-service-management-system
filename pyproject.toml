[tool.pyrefly]
import_root = "backend"
import_roots = ["backend", "backend/db", "venv/Lib/site-packages"]
search_paths = [
    "venv/Lib/site-packages",
    "backend",
    "backend/db",
    "c:/Users/charm/Desktop/Shoelotskey Service Management System/backend",
    "c:/Users/charm/Desktop/Shoelotskey Service Management System/venv/Lib/site-packages"
]
ignore_missing_imports = true
exclude = [
    "*__pyrefly_virtual__*",
    "*inmemory*",
    "*venv*",
    "*brain*",
    "*scratch*",
    "*tmp*",
    "**/__pyrefly_virtual__/**",
    "**/inmemory/**"
]

[tool.pyre]
source_directories = ["backend"]
search_path = [
    "venv/Lib/site-packages",
    "backend",
    "backend/db"
]
exclude = [
    ".*__pyrefly_virtual__.*",
    ".*inmemory.*",
    ".*venv.*",
    ".*brain.*",
    ".*tmp.*",
    ".*scratch.*"
]
