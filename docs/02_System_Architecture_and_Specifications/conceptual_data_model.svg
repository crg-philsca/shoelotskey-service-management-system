    <ellipse cx="720" cy="75" rx="46" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="720" y="79" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Staff ID / Role</text>
  </g>

  <!-- Job Order Attributes (Grouped safely on the left of Job Order) -->
  <g>
    <ellipse cx="390" cy="180" rx="38" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="390" y="184" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Order No</text>
    <ellipse cx="460" cy="140" rx="44" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="460" y="144" font-size="10" text-anchor="middle" fill="#1e293b">Order Date</text>
    <ellipse cx="390" cy="225" rx="40" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="390" y="229" font-size="10" text-anchor="middle" fill="#1e293b">Status</text>
  </g>

  <!-- Shoe Item Attributes -->
  <g>
    <ellipse cx="1060" cy="155" rx="38" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1060" y="159" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Item ID</text>
    <ellipse cx="1150" cy="125" rx="46" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1150" y="129" font-size="10" text-anchor="middle" fill="#1e293b">Brand &amp; Model</text>
    <ellipse cx="1240" cy="155" rx="44" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1240" y="159" font-size="10" text-anchor="middle" fill="#1e293b">Intake Photos</text>
  </g>

  <!-- Service Catalog Attributes (To the right) -->
  <g>
    <ellipse cx="1320" cy="480" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1320" y="484" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Service ID</text>
    <ellipse cx="1335" cy="516" rx="48" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1335" y="520" font-size="10" text-anchor="middle" fill="#1e293b">Service Name</text>
    <ellipse cx="1320" cy="552" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1320" y="556" font-size="10" text-anchor="middle" fill="#1e293b">Base Fee</text>
  </g>

  <!-- Inventory Material Attributes (Below) -->
  <g>
    <ellipse cx="1060" cy="845" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="1060" y="849" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Item Code</text>
    <ellipse cx="1150" cy="870" rx="44" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1150" y="874" font-size="10" text-anchor="middle" fill="#1e293b">Material Name</text>
    <ellipse cx="1245" cy="845" rx="50" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="1245" y="849" font-size="10" text-anchor="middle" fill="#1e293b">Stock &amp; Unit</text>
  </g>

  <!-- Payment Record Attributes (To the left) -->
  <g>
    <ellipse cx="395" cy="480" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
