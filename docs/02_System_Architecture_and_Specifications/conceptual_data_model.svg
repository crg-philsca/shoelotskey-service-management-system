    <ellipse cx="195" cy="840" rx="52" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="195" y="844" font-size="9.5" text-anchor="middle" fill="#1e293b">Role / Overrides</text>
