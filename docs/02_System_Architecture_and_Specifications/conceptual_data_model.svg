<svg viewBox="0 0 1500 930" width="1500" height="930" xmlns="http://www.w3.org/2000/svg" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title & Legend Header in SVG -->
  <text x="750" y="32" font-size="20" font-weight="800" fill="#b91c1c" text-anchor="middle">Shoelotskey Service Management System</text>
  <text x="750" y="52" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Conceptual Data Model Architecture (Peter Chen's Notation with Operational Decision Gateways)</text>

  <!-- ==================== 1. SOLID RELATIONSHIP CONNECTORS ==================== -->
  <!-- Customer to Places to Job Order -->
  <line x1="210" y1="266" x2="300" y2="266" stroke="#475569" stroke-width="2"/>
  <line x1="380" y1="266" x2="475" y2="266" stroke="#475569" stroke-width="2"/>
  <text x="225" y="256" fill="#0f172a" font-weight="800" font-size="14">1</text>
  <text x="450" y="256" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- Staff to Intakes to Job Order -->
  <line x1="575" y1="100" x2="575" y2="135" stroke="#475569" stroke-width="2"/>
  <line x1="575" y1="185" x2="575" y2="240" stroke="#475569" stroke-width="2"/>
  <text x="585" y="120" fill="#0f172a" font-weight="800" font-size="14">1</text>
  <text x="585" y="225" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- Job Order to Consists Of to Shoe Item -->
  <line x1="675" y1="266" x2="875" y2="266" stroke="#475569" stroke-width="2"/>
  <line x1="965" y1="266" x2="1050" y2="266" stroke="#475569" stroke-width="2"/>
  <text x="695" y="256" fill="#0f172a" font-weight="800" font-size="14">1</text>
  <text x="1030" y="256" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- Shoe Item to Requires to Service Catalog -->
  <line x1="1140" y1="292" x2="1140" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="1140" y1="420" x2="1140" y2="490" stroke="#475569" stroke-width="2"/>
  <text x="1150" y="320" fill="#0f172a" font-weight="800" font-size="14">M</text>
  <text x="1150" y="470" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- Service Catalog to Consumes to Inventory Material -->
  <line x1="1140" y1="542" x2="1140" y2="610" stroke="#475569" stroke-width="2"/>
  <line x1="1140" y1="670" x2="1140" y2="740" stroke="#475569" stroke-width="2"/>
  <text x="1150" y="570" fill="#0f172a" font-weight="800" font-size="14">M</text>
  <text x="1150" y="720" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- Job Order to Settles Via to Payment Record -->
  <line x1="575" y1="292" x2="575" y2="360" stroke="#475569" stroke-width="2"/>
  <line x1="575" y1="420" x2="575" y2="490" stroke="#475569" stroke-width="2"/>
  <text x="585" y="320" fill="#0f172a" font-weight="800" font-size="14">1</text>
  <text x="585" y="470" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- Job Order to Applies to Discount -->
  <line x1="475" y1="280" x2="355" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="285" y1="420" x2="210" y2="500" stroke="#475569" stroke-width="2"/>
  <text x="430" y="325" fill="#0f172a" font-weight="800" font-size="14">1</text>
  <text x="235" y="475" fill="#0f172a" font-weight="800" font-size="14">0..1</text>

  <!-- Owner to Authorizes to Discount -->
  <line x1="135" y1="542" x2="135" y2="610" stroke="#475569" stroke-width="2"/>
  <line x1="135" y1="670" x2="135" y2="740" stroke="#475569" stroke-width="2"/>
  <text x="145" y="570" fill="#0f172a" font-weight="800" font-size="14">1</text>
  <text x="145" y="720" fill="#0f172a" font-weight="800" font-size="14">M</text>

  <!-- ==================== 2. DECISION GATEWAYS (DASHED AMBER - NO FILL) ==================== -->
  <!-- Priority Decision: Job Order -> Decision Gate -->
  <path d="M 675 266 L 755 266" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
  
  <!-- Priority Outcomes (Branched Vertically: Up and Down, 200px+ away from Requires) -->
  <path d="M 800 236 L 800 175" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="740" y="145" width="120" height="30" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="800" y="164" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">⚡ Rush (+50% Fee)</text>

  <path d="M 800 296 L 800 355" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="735" y="355" width="130" height="30" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="800" y="374" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Regular (FIFO Queue)</text>

  <!-- Settlement Decision: Payment Record -> Settlement Gate -->
  <line x1="575" y1="542" x2="575" y2="615" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
  
  <!-- Settlement Outcomes (Horizontal branches with zero collisions) -->
  <path d="M 635 650 L 710 650" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="710" y="635" width="175" height="30" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="797" y="654" font-size="10.5" font-weight="bold" fill="#065f46" text-anchor="middle">✓ Fully Paid: Release Shoes</text>

  <path d="M 515 650 L 440 650" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
  <rect x="250" y="635" width="190" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="345" y="654" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">⏳ 50% Deposit: Hold Item</text>

  <!-- ==================== 3. ATTRIBUTE CONNECTORS (THIN GREY) ==================== -->
  <!-- Customer Attributes -->
  <line x1="135" y1="240" x2="65" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="135" y1="240" x2="135" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="135" y1="240" x2="205" y2="165" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Job Order Attributes (Positioned comfortably on the left side) -->
  <line x1="475" y1="250" x2="390" y2="185" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="510" y1="240" x2="460" y2="145" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="475" y1="270" x2="390" y2="230" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Shoe Item Attributes -->
  <line x1="1100" y1="240" x2="1060" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="1140" y1="240" x2="1150" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="1180" y1="240" x2="1240" y2="165" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Service Attributes (To the right) -->
  <line x1="1230" y1="505" x2="1310" y2="480" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="1230" y1="516" x2="1310" y2="516" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="1230" y1="527" x2="1310" y2="552" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Inventory Attributes (Below) -->
  <line x1="1100" y1="792" x2="1060" y2="845" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="1140" y1="792" x2="1150" y2="870" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="1180" y1="792" x2="1245" y2="845" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Payment Attributes (To the left) -->
  <line x1="485" y1="500" x2="400" y2="475" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="485" y1="516" x2="390" y2="516" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="485" y1="532" x2="400" y2="557" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Discount Attributes (Below) -->
  <line x1="105" y1="542" x2="70" y2="590" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="165" y1="542" x2="195" y2="590" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Owner Attributes (Below) -->
  <line x1="105" y1="792" x2="75" y2="840" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="165" y1="792" x2="195" y2="840" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Staff Attributes (To the right) -->
  <line x1="655" y1="75" x2="720" y2="75" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- ==================== 4. ENTITIES (DARK BLUE RECTANGLES) ==================== -->
  <!-- STAFF / USER -->
  <rect x="495" y="50" width="160" height="50" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="80" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">STAFF / USER</text>

  <!-- CUSTOMER -->
  <rect x="60" y="240" width="150" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="272" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CUSTOMER</text>

  <!-- JOB ORDER -->
  <rect x="475" y="240" width="200" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="575" y="272" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">JOB ORDER</text>

  <!-- SHOE ITEM -->
  <rect x="1050" y="240" width="180" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="272" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SHOE ITEM (PAIR)</text>

  <!-- SERVICE CATALOG -->
  <rect x="1050" y="490" width="180" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="522" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SERVICE CATALOG</text>

  <!-- INVENTORY MATERIAL -->
  <rect x="1050" y="740" width="180" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="772" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">INVENTORY / SUPPLY</text>

  <!-- PAYMENT RECORD -->
  <rect x="485" y="490" width="180" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="522" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PAYMENT RECORD</text>

  <!-- DISCOUNT -->
  <rect x="60" y="490" width="150" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="522" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">DISCOUNT</text>

  <!-- OWNER (ROLE) -->
  <rect x="60" y="740" width="150" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="772" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">OWNER (ADMIN)</text>

  <!-- ==================== 5. RELATIONSHIPS (CHEN RED DIAMONDS) ==================== -->
  <!-- PLACES -->
  <polygon points="340,241 380,266 340,291 300,266" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="340" y="270" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">PLACES</text>

  <!-- INTAKES -->
  <polygon points="575,135 605,160 575,185 545,160" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="164" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">INTAKES</text>

  <!-- CONSISTS OF -->
  <polygon points="920,241 965,266 920,291 875,266" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="920" y="270" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">CONSISTS OF</text>

  <!-- REQUIRES -->
  <polygon points="1140,360 1180,390 1140,420 1100,390" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="394" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">REQUIRES</text>

  <!-- CONSUMES -->
  <polygon points="1140,610 1180,640 1140,670 1100,640" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1140" y="644" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">CONSUMES</text>

  <!-- SETTLES VIA -->
  <polygon points="575,360 615,390 575,420 535,390" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="394" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">SETTLES VIA</text>

  <!-- APPLIES -->
  <polygon points="320,374 355,400 320,426 285,400" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="320" y="404" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">APPLIES</text>

  <!-- AUTHORIZES -->
  <polygon points="135,610 175,640 135,670 95,640" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
  <text x="135" y="644" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">AUTHORIZES</text>

  <!-- ==================== 6. DECISION NODES (AMBER DIAMONDS) ==================== -->
  <!-- PRIORITY DECISION GATE -->
  <polygon points="800,236 845,266 800,296 755,266" fill="#d97706" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="264" fill="#ffffff" font-size="8.5" font-weight="bold" text-anchor="middle">Priority Gate</text>
  <text x="800" y="275" fill="#ffffff" font-size="7.5" text-anchor="middle">(Rush?)</text>

  <!-- PAYMENT SETTLEMENT GATE -->
  <polygon points="575,615 635,650 575,685 515,650" fill="#d97706" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="648" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Settlement Gate</text>
  <text x="575" y="659" fill="#ffffff" font-size="7.5" text-anchor="middle">(Balance = ₱0?)</text>

  <!-- ==================== 7. ATTRIBUTES (ELLIPSES) ==================== -->
  <!-- Customer Attributes -->
  <g>
    <ellipse cx="65" cy="155" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="65" y="159" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Customer ID</text>
    <ellipse cx="135" cy="125" rx="40" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="135" y="129" font-size="10" text-anchor="middle" fill="#1e293b">Full Name</text>
    <ellipse cx="205" cy="155" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="205" y="159" font-size="10" text-anchor="middle" fill="#1e293b">Contact No</text>
  </g>

  <!-- Staff Attributes -->
