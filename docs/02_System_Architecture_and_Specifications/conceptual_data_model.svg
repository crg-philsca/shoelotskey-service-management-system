    <ellipse cx="385" cy="516" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="385" y="520" font-size="10" text-anchor="middle" fill="#1e293b">Amount Paid</text>
    <ellipse cx="395" cy="552" rx="45" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="395" y="556" font-size="10" text-anchor="middle" fill="#1e293b">Method / Slip</text>
  </g>

  <!-- Discount Attributes (Below Discount) -->
  <g>
    <ellipse cx="70" cy="590" rx="46" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="70" y="594" font-size="9.5" text-anchor="middle" fill="#1e293b">Discount Type</text>
    <ellipse cx="195" cy="590" rx="50" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="195" y="594" font-size="9.5" text-anchor="middle" fill="#1e293b">Valid ID No</text>
  </g>

  <!-- Owner Attributes (Below Owner) -->
  <g>
    <ellipse cx="75" cy="840" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
