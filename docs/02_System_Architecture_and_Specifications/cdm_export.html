<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 1500px;
    }
    .header-box {
      width: 100%;
      text-align: center;
      margin-bottom: 24px;
    }
    .header-box h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #b91c1c;
      letter-spacing: -0.01em;
    }
    .header-box p {
      font-size: 14px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 600;
    }
    .legend-row {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 24px;
      padding: 10px 24px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }
    .legend-item { display: inline-flex; align-items: center; gap: 8px; }
    .symbol-ent { width: 20px; height: 16px; background: #1e293b; border-radius: 3px; }
    .symbol-rel { width: 14px; height: 14px; background: #b91c1c; transform: rotate(45deg); border-radius: 2px; }
    .symbol-dec { width: 14px; height: 14px; background: #d97706; transform: rotate(45deg); border-radius: 2px; }
    .symbol-att { width: 22px; height: 14px; background: #ffffff; border: 1.5px solid #64748b; border-radius: 50%; }
    .tag-card { background: #e2e8f0; padding: 2px 8px; border-radius: 4px; font-family: monospace; font-size: 12px; }
    .svg-wrapper {
      width: 1440px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>Shoelotskey Service Management System</h1>
    <p>Conceptual Data Model Architecture (Peter Chen's Notation with Operational Decision Gateways)</p>
  </div>

  <div class="legend-row">
    <div class="legend-item"><div class="symbol-ent"></div> Entity (Rectangle)</div>
    <div class="legend-item"><div class="symbol-rel"></div> Active Verb (Red Diamond)</div>
    <div class="legend-item"><div class="symbol-dec"></div> Decision Gateway (Amber Diamond)</div>
    <div class="legend-item"><div class="symbol-att"></div> Attribute (Ellipse)</div>
    <div class="legend-item"><span class="tag-card">1 : N</span> Cardinality</div>
  </div>

  <div class="svg-wrapper">
    <svg viewBox="0 0 1420 890" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
        </filter>
      </defs>

      <!-- ==================== 1. SOLID RELATIONSHIP CONNECTORS ==================== -->
      <!-- Customer to Places to Job Order -->
      <line x1="200" y1="226" x2="290" y2="226" stroke="#475569" stroke-width="2"/>
      <line x1="360" y1="226" x2="450" y2="226" stroke="#475569" stroke-width="2"/>
      <text x="215" y="218" fill="#0f172a" font-weight="800" font-size="14">1</text>
      <text x="430" y="218" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- Staff to Intakes to Job Order -->
      <line x1="530" y1="80" x2="530" y2="115" stroke="#475569" stroke-width="2"/>
      <line x1="530" y1="165" x2="530" y2="200" stroke="#475569" stroke-width="2"/>
      <text x="540" y="100" fill="#0f172a" font-weight="800" font-size="14">1</text>
      <text x="540" y="190" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- Job Order to Consists Of to Shoe Item -->
      <line x1="610" y1="226" x2="690" y2="226" stroke="#475569" stroke-width="2"/>
      <line x1="780" y1="226" x2="870" y2="226" stroke="#475569" stroke-width="2"/>
      <text x="625" y="218" fill="#0f172a" font-weight="800" font-size="14">1</text>
      <text x="850" y="218" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- Shoe Item to Requires to Service Catalog -->
      <line x1="950" y1="252" x2="950" y2="316" stroke="#475569" stroke-width="2"/>
      <line x1="950" y1="376" x2="950" y2="440" stroke="#475569" stroke-width="2"/>
      <text x="960" y="275" fill="#0f172a" font-weight="800" font-size="14">M</text>
      <text x="960" y="425" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- Service Catalog to Consumes to Inventory Material -->
      <line x1="950" y1="492" x2="950" y2="548" stroke="#475569" stroke-width="2"/>
      <line x1="950" y1="608" x2="950" y2="690" stroke="#475569" stroke-width="2"/>
      <text x="960" y="515" fill="#0f172a" font-weight="800" font-size="14">M</text>
      <text x="960" y="675" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- Job Order to Settles Via to Payment Record -->
      <line x1="530" y1="252" x2="530" y2="316" stroke="#475569" stroke-width="2"/>
      <line x1="530" y1="376" x2="530" y2="440" stroke="#475569" stroke-width="2"/>
      <text x="540" y="275" fill="#0f172a" font-weight="800" font-size="14">1</text>
      <text x="540" y="425" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- Job Order to Applies to Discount -->
      <path d="M 450 240 L 325 320" stroke="#475569" stroke-width="2"/>
      <path d="M 260 365 L 175 440" stroke="#475569" stroke-width="2"/>
      <text x="405" y="275" fill="#0f172a" font-weight="800" font-size="14">1</text>
      <text x="200" y="415" fill="#0f172a" font-weight="800" font-size="14">0..1</text>

      <!-- Owner to Authorizes to Discount -->
      <line x1="130" y1="492" x2="130" y2="548" stroke="#475569" stroke-width="2"/>
      <line x1="130" y1="608" x2="130" y2="690" stroke="#475569" stroke-width="2"/>
      <text x="140" y="515" fill="#0f172a" font-weight="800" font-size="14">1</text>
      <text x="140" y="675" fill="#0f172a" font-weight="800" font-size="14">N</text>

      <!-- ==================== 2. DECISION GATEWAYS (DASHED AMBER) ==================== -->
      <!-- Priority Decision: Job Order -> Decision Gate -->
      <path d="M 580 252 L 580 346 L 685 346" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
      
      <!-- Priority Outcomes -->
      <path d="M 775 346 L 820 346" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
      <rect x="820" y="332" width="105" height="28" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
      <text x="872" y="350" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">⚡ Rush (+50% Fee)</text>

      <path d="M 730 380 L 730 415" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
      <rect x="675" y="415" width="110" height="28" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
      <text x="730" y="433" font-size="10.5" font-weight="bold" fill="#334155" text-anchor="middle">Regular (FIFO Queue)</text>

      <!-- Settlement Decision: Payment Record -> Settlement Gate -->
      <line x1="530" y1="492" x2="530" y2="545" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>
      
      <!-- Settlement Outcomes -->
      <path d="M 590 580 L 640 580" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
      <rect x="640" y="565" width="165" height="30" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
      <text x="722" y="584" font-size="10.5" font-weight="bold" fill="#065f46" text-anchor="middle">✓ Fully Paid: Release Shoes</text>

      <path d="M 470 580 L 410 580" stroke="#d97706" stroke-width="1.8" stroke-dasharray="3 3"/>
      <rect x="235" y="565" width="175" height="30" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
      <text x="322" y="584" font-size="10.5" font-weight="bold" fill="#92400e" text-anchor="middle">⏳ 50% Deposit: Hold Item</text>

      <!-- ==================== 3. ATTRIBUTE CONNECTORS (THIN GREY) ==================== -->
      <!-- Customer Attributes -->
      <line x1="125" y1="200" x2="70" y2="125" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="125" y1="200" x2="140" y2="95" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="125" y1="200" x2="210" y2="125" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Job Order Attributes -->
      <line x1="500" y1="200" x2="450" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="530" y1="200" x2="545" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="560" y1="200" x2="645" y2="135" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Shoe Item Attributes -->
      <line x1="920" y1="200" x2="870" y2="125" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="950" y1="200" x2="970" y2="125" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="980" y1="200" x2="1075" y2="125" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Service Attributes -->
      <line x1="1030" y1="450" x2="1100" y2="425" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="1030" y1="466" x2="1100" y2="466" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="1030" y1="480" x2="1100" y2="507" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Inventory Attributes -->
      <line x1="910" y1="742" x2="870" y2="795" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="950" y1="742" x2="970" y2="795" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="990" y1="742" x2="1080" y2="795" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Payment Attributes -->
      <line x1="450" y1="450" x2="380" y2="425" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="450" y1="466" x2="370" y2="466" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="450" y1="480" x2="380" y2="507" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Discount Attributes -->
      <line x1="100" y1="492" x2="70" y2="540" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="160" y1="492" x2="185" y2="540" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Owner Attributes -->
      <line x1="100" y1="742" x2="80" y2="795" stroke="#94a3b8" stroke-width="1.2"/>
      <line x1="160" y1="742" x2="190" y2="795" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- Staff Attributes -->
      <line x1="610" y1="55" x2="680" y2="20" stroke="#94a3b8" stroke-width="1.2"/>

      <!-- ==================== 4. ENTITIES (DARK BLUE RECTANGLES) ==================== -->
      <!-- STAFF / USER -->
      <rect x="450" y="30" width="160" height="50" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="530" y="60" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">STAFF / USER</text>

      <!-- CUSTOMER -->
      <rect x="50" y="200" width="150" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="125" y="232" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CUSTOMER</text>

      <!-- JOB ORDER -->
      <rect x="450" y="200" width="160" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2.5" filter="url(#shadow)"/>
      <text x="530" y="232" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">JOB ORDER</text>

      <!-- SHOE ITEM -->
      <rect x="870" y="200" width="160" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="950" y="232" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SHOE ITEM (PAIR)</text>

      <!-- SERVICE CATALOG -->
      <rect x="870" y="440" width="160" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="950" y="472" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">SERVICE CATALOG</text>

      <!-- INVENTORY MATERIAL -->
      <rect x="870" y="690" width="160" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="950" y="722" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">INVENTORY / SUPPLY</text>

      <!-- PAYMENT RECORD -->
      <rect x="445" y="440" width="170" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="530" y="472" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">PAYMENT RECORD</text>

      <!-- DISCOUNT -->
      <rect x="50" y="440" width="160" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="130" y="472" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">DISCOUNT / PRIVILEGE</text>

      <!-- OWNER (ROLE) -->
      <rect x="50" y="690" width="160" height="52" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2" filter="url(#shadow)"/>
      <text x="130" y="722" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">OWNER (ADMIN)</text>

      <!-- ==================== 5. RELATIONSHIPS (CHEN RED DIAMONDS) ==================== -->
      <!-- PLACES -->
      <polygon points="325,201 360,226 325,251 290,226" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="325" y="230" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">PLACES</text>

      <!-- INTAKES -->
      <polygon points="530,115 560,140 530,165 500,140" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="530" y="144" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">INTAKES</text>

      <!-- CONSISTS OF -->
      <polygon points="735,201 780,226 735,251 690,226" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="735" y="230" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">CONSISTS OF</text>

      <!-- REQUIRES -->
      <polygon points="950,316 985,346 950,376 915,346" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="950" y="350" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">REQUIRES</text>

      <!-- CONSUMES -->
      <polygon points="950,548 985,578 950,608 915,578" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="950" y="582" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">CONSUMES</text>

      <!-- SETTLES VIA -->
      <polygon points="530,316 570,346 530,376 490,346" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="530" y="350" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">SETTLES VIA</text>

      <!-- APPLIES -->
      <polygon points="290,320 325,346 290,372 255,346" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="290" y="350" fill="#ffffff" font-size="9.5" font-weight="bold" text-anchor="middle">APPLIES</text>

      <!-- AUTHORIZES -->
      <polygon points="130,548 168,578 130,608 92,578" fill="#b91c1c" stroke="#991b1b" stroke-width="2" filter="url(#shadow)"/>
      <text x="130" y="582" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">AUTHORIZES</text>

      <!-- ==================== 6. DECISION NODES (AMBER DIAMONDS) ==================== -->
      <!-- PRIORITY DECISION GATE -->
      <polygon points="730,316 775,346 730,376 685,346" fill="#d97706" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
      <text x="730" y="344" fill="#ffffff" font-size="8.5" font-weight="bold" text-anchor="middle">Priority Gate</text>
      <text x="730" y="354" fill="#ffffff" font-size="7.5" text-anchor="middle">(Rush?)</text>

      <!-- PAYMENT SETTLEMENT GATE -->
      <polygon points="530,545 590,580 530,615 470,580" fill="#d97706" stroke="#b45309" stroke-width="2" filter="url(#shadow)"/>
      <text x="530" y="578" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">Settlement Gate</text>
      <text x="530" y="589" fill="#ffffff" font-size="7.5" text-anchor="middle">(Balance = ₱0?)</text>

      <!-- ==================== 7. ATTRIBUTES (ELLIPSES) ==================== -->
      <!-- Customer Attributes -->
      <g>
        <ellipse cx="70" cy="125" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="70" y="129" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Customer ID</text>
        <ellipse cx="140" cy="95" rx="40" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="140" y="99" font-size="10" text-anchor="middle" fill="#1e293b">Full Name</text>
        <ellipse cx="210" cy="125" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="210" y="129" font-size="10" text-anchor="middle" fill="#1e293b">Contact No</text>
      </g>

      <!-- Staff Attributes -->
      <g>
        <ellipse cx="690" cy="20" rx="42" ry="16" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="690" y="24" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Staff ID / Role</text>
      </g>

      <!-- Job Order Attributes -->
      <g>
        <ellipse cx="450" cy="135" rx="38" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="450" y="139" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Order No</text>
        <ellipse cx="545" cy="135" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="545" y="139" font-size="10" text-anchor="middle" fill="#1e293b">Order Date</text>
        <ellipse cx="645" cy="135" rx="40" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="645" y="139" font-size="10" text-anchor="middle" fill="#1e293b">Status</text>
      </g>

      <!-- Shoe Item Attributes -->
      <g>
        <ellipse cx="870" cy="125" rx="38" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="870" y="129" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Item ID</text>
        <ellipse cx="970" cy="125" rx="46" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="970" y="129" font-size="10" text-anchor="middle" fill="#1e293b">Brand & Model</text>
        <ellipse cx="1075" cy="125" rx="44" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="1075" y="129" font-size="10" text-anchor="middle" fill="#1e293b">Intake Photos</text>
      </g>

      <!-- Service Catalog Attributes -->
      <g>
        <ellipse cx="1110" cy="425" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="1110" y="429" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Service ID</text>
        <ellipse cx="1125" cy="466" rx="48" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="1125" y="470" font-size="10" text-anchor="middle" fill="#1e293b">Service Name</text>
        <ellipse cx="1110" cy="507" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="1110" y="511" font-size="10" text-anchor="middle" fill="#1e293b">Base Fee</text>
      </g>

      <!-- Inventory Material Attributes -->
      <g>
        <ellipse cx="870" cy="795" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="870" y="799" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Item Code</text>
        <ellipse cx="970" cy="795" rx="44" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="970" y="799" font-size="10" text-anchor="middle" fill="#1e293b">Material Name</text>
        <ellipse cx="1080" cy="795" rx="50" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="1080" y="799" font-size="10" text-anchor="middle" fill="#1e293b">Stock & Unit</text>
      </g>

      <!-- Payment Record Attributes -->
      <g>
        <ellipse cx="330" cy="425" rx="42" ry="17" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
        <text x="330" y="429" font-size="10" font-weight="bold" text-anchor="middle" fill="#0f172a" text-decoration="underline">Payment Ref</text>
        <ellipse cx="320" cy="466" rx="42" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="320" y="470" font-size="10" text-anchor="middle" fill="#1e293b">Amount Paid</text>
        <ellipse cx="330" cy="507" rx="45" ry="17" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="330" y="511" font-size="10" text-anchor="middle" fill="#1e293b">Method / Slip</text>
      </g>
