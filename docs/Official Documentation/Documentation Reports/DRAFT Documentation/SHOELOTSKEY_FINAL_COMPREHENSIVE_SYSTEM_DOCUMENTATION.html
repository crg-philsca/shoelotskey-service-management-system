<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHOELOTSKEY FINAL COMPREHENSIVE SYSTEM DOCUMENTATION</title>
  <style>
    :root {
      --primary: #0284c7; --bg: #f8fafc; --card: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
      --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --purple: #8b5cf6;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; margin:0; padding: 20px; }
    .container { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; height: 95vh; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .header { padding: 30px; background: linear-gradient(135deg, #0f172a, #0369a1); border-bottom: 4px solid var(--warning); flex-shrink: 0; color: #fff; }
    h1 { margin: 0 0 10px 0; font-size: 2rem; }
    .subtitle { color: #cbd5e1; margin: 0; }
    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 340px; background: #f8fafc; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .search-box { padding: 15px; border-bottom: 1px solid var(--border); }
    .search-box input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
    .nav { flex: 1; overflow-y: auto; padding: 15px 0; }
    .nav-link { display: block; padding: 8px 20px; color: #334155; text-decoration: none; border-left: 3px solid transparent; cursor: pointer; }
    .nav-link:hover, .nav-link.active { background: #e0f2fe; color: var(--primary); border-left-color: var(--primary); font-weight: bold; }
    .content { flex: 1; padding: 40px; overflow-y: auto; }
    .section { display: none; }
    .section.active { display: block; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(10px);} to {opacity:1; transform:translateY(0);} }
    h2 { color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.95rem; }
    th, td { padding: 12px; border: 1px solid var(--border); text-align: left; }
    th { background: #f1f5f9; }
    .status { padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }
    .s-impl { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .s-ver { background: #e0f2fe; color: #0369a1; border: 1px solid #bae6fd; }
    .s-eval { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }
    .s-part { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .s-pend { background: #ffedd5; color: #9a3412; border: 1px solid #fdba74; }
    .s-unv { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .callout { padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary); background: #f0f9ff; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display:flex; gap:10px; margin-bottom:10px;">
        <span class="status s-eval" style="color:#fff; background:rgba(255,255,255,0.2);">ISO 25010 Evaluated</span>
        <span class="status s-part" style="color:#fff; background:rgba(255,255,255,0.2);">TAM Partially Evaluated</span>
      </div>
      <h1>Final Comprehensive System Documentation</h1>
      <p class="subtitle">62-Section Master Technical & Architecture Reference (Evidence-Backed)</p>
    </div>
    <div class="layout">
      <div class="sidebar">
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search document..." onkeyup="search()"></div>
        <div class="nav" id="nav"></div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>

  <script>
    const sections = [
      { title: "01. Executive Summary", html: "<p>The Shoelotskey Service Management System is a centralized, cloud-hosted web application deployed on Heroku. It resolves the operational friction of manual logbooks by providing digital job order workflows, an advisory Machine Learning turnaround estimator (Random Forest), and real-time sales/inventory analytics. Evaluated highly by 3 IT experts (3.71/4.00) under ISO/IEC 25010:2023. TAM is partially evaluated, with 2 Staff respondents scoring 4.00.</p>" },
      { title: "02. Evidence Status & Definitions", html: "<p>Evidence strictly dictates status. <span class='status s-impl'>[IMPLEMENTED]</span> Code exists. <span class='status s-ver'>[VERIFIED]</span> Tested behavior. <span class='status s-eval'>[EVALUATED]</span> Assessed via signed form. <span class='status s-part'>[PARTIALLY IMPLEMENTED]</span> Incomplete. <span class='status s-pend'>[PENDING VERIFICATION]</span> Waiting real-world evidence. <span class='status s-unv'>[UNVERIFIED]</span> Claim lacks proof.</p>" },
      { title: "03. Contradiction Register", html: "<table><tr><th>Claim</th><th>Actual Evidence</th><th>Status</th></tr><tr><td>85% ML Accuracy</td><td>MAE 7.61, RMSE 8.93, R² 0.1959. Regression lacks % accuracy.</td><td><span class='status s-unv'>UNVERIFIED</span> (Replaced by continuous metrics)</td></tr><tr><td>5 TAM Employees</td><td>Signed forms show Staff 1, Staff 2, Owner (Pending). Target = 3.</td><td><span class='status s-unv'>UNVERIFIED</span> (Corrected to Owner + 2 Staff)</td></tr><tr><td>TAM = 9 Characteristics</td><td>TAM has 4 constructs (PU, PEOU, BI, ASU). ISO has 9.</td><td><span class='status s-unv'>UNVERIFIED</span> (Corrected framework boundaries)</td></tr><tr><td>100% Secure</td><td>JWT/Bcrypt/OWASP mitigations present. MFA missing.</td><td><span class='status s-unv'>UNVERIFIED</span> (Corrected to OWASP Compliant)</td></tr><tr><td>Offline Capable</td><td>Heroku-hosted web app; fails without internet.</td><td><span class='status s-unv'>UNVERIFIED</span></td></tr><tr><td>89 Use Cases Passed</td><td>Manual functional verification scenarios documented.</td><td><span class='status s-ver'>VERIFIED</span></td></tr></table>" },
      { title: "04. Objective Traceability", html: "<p><span class='status s-ver'>VERIFIED</span> Every feature maps to Objectives 1-5 (Centralized Orders, ML Prediction, Analytics, ISO 25010, TAM).</p>" },
      { title: "05. System Architecture", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Logical 3-Tier Layered Architecture: Presentation Layer (React 18 SPA), Application Layer (FastAPI Python Controller), Data Layer (PostgreSQL 3NF). Deployed as a modular monolith on a single Heroku web dyno. Not a microservices architecture. Not a clustered high-availability setup.</p>" },
      { title: "06. Database Design", html: "<p><span class='status s-ver'>VERIFIED</span> Database strictly conforms to 3NF. Surrogate primary keys (1NF). No partial dependencies on composite keys (2NF). Customer contact info isolated in `customers` table, preventing transitive dependencies in `job_orders` (3NF).</p>" },
      { title: "07. End-to-End Traces", html: "<p><span class='status s-ver'>VERIFIED</span> <strong>Trace: Job Order Creation:</strong> React Form UI &rarr; `fetch POST /api/orders` &rarr; FastAPI `orders.py` Router &rarr; `Depends(get_current_user)` Auth Check &rarr; `business_rules.py` Release Date Calc &rarr; SQLAlchemy ORM Insert &rarr; PostgreSQL Commit &rarr; 201 Created Response.</p>" },
      { title: "08. Deployment Architecture", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Deployed on Heroku-24 Dyno. PostgreSQL Essential-0. Name.com domain. ACM SSL.</p>" },
      { title: "09. Job Order Workflow", html: "<p><span class='status s-ver'>VERIFIED</span> Intake &rarr; Option B Estimation (Rules vs ML) &rarr; Payment &rarr; Status Progression &rarr; Inventory Deduction &rarr; Claimed.</p>" },
      { title: "10. Inventory & Supply Management", html: "<p><span class='status s-ver'>VERIFIED</span> 4 KPI cards (Total, In Stock, No Stock, Low Stock). Atomic deduction upon order completion.</p>" },
      { title: "11. Analytics & Reporting", html: "<p><span class='status s-ver'>VERIFIED</span> Dashboard generates sales, expenses, net profit, and ROI reports via PDF/print.</p>" },
      { title: "12. Client & Service Management", html: "<p><span class='status s-ver'>VERIFIED</span> Client order history and lifetime spend tracking. Service catalog drives Official Release Date rules.</p>" },
      { title: "13. Machine Learning Model", html: "<p><span class='status s-impl'>IMPLEMENTED</span> `RandomForestRegressor` with parameters `n_estimators=150`, `max_depth=10`, `random_state=42`. Predicts `CompletionDays`. 18 Canonical features used.</p>" },
      { title: "14. ML Metrics & Advisory Rule", html: "<p><span class='status s-ver'>VERIFIED</span> Metrics: MAE 7.61, RMSE 8.93, R² 0.1959. <strong>Advisory Rule:</strong> Due to high variance, ML predicts advisory dates. Business rules set Official dates.</p>" },
      { title: "15. OCR Data Pipeline", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Historical pipeline: Paper scan &rarr; Gemini Vision OCR &rarr; Pending Review &rarr; Human Correction in UI &rarr; VALIDATED &rarr; Eligible for ML training. EasyOCR removed due to slug limits.</p>" },
      { title: "16. Authentication", html: "<p><span class='status s-ver'>VERIFIED</span> JWT tokens and bcrypt hashing (work factor 12). Tokens expire in 24 hours; frontend localStorage wipes in 30 minutes of inactivity.</p>" },
      { title: "17. OWASP Top 10 Mitigation", html: "<table><tr><th>OWASP Category</th><th>Evidence</th><th>Status</th></tr><tr><td>A01 Broken Access Control</td><td>JWT RBAC in FastAPI `Depends`</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A02 Cryptographic Failures</td><td>bcrypt / HTTPS</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A03 Injection</td><td>SQLAlchemy Parameterization</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A04 Insecure Design</td><td>3-attempt 15-min account lockout</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A05 Misconfiguration</td><td>FastAPI exception sanitization</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A06 Vulnerable Components</td><td>Dependabot tracking</td><td><span class='status s-part'>PARTIAL</span></td></tr><tr><td>A07 Auth Failures</td><td>React 30-min inactivity wipe</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A08 Data Integrity</td><td>Pickle model loading restricted</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A09 Logging</td><td>Centralized `audit_logs` table</td><td><span class='status s-ver'>VERIFIED</span></td></tr><tr><td>A10 SSRF</td><td>No external fetching enabled</td><td><span class='status s-unv'>NOT APPLICABLE</span></td></tr></table>" },
      { title: "18. RBAC Implementation", html: "<p><span class='status s-ver'>VERIFIED</span> Staff and Owner roles strictly enforced in backend middleware.</p>" },
      { title: "19. ISO/IEC 25010 Results", html: "<p><span class='status s-eval'>EVALUATED</span> ISO/IEC 25010:2023 evaluated by 3 IT experts (Jheo Corona, Dr. Eduardo Yu, Edison R. Yu). Composite: <strong>3.71 / 4.00 (Highly Acceptable)</strong>.</p>" },
      { title: "20. TAM Methodology & Status", html: "<table><tr><th>Respondent</th><th>Role</th><th>Date</th><th>Mean Score</th><th>Status</th></tr><tr><td>Staff 1</td><td>Staff</td><td>08/31/2026</td><td>4.00</td><td><span class='status s-eval'>EVALUATED</span></td></tr><tr><td>Staff 2 (Joy)</td><td>Staff</td><td>08/31/2026</td><td>4.00</td><td><span class='status s-eval'>EVALUATED</span></td></tr><tr><td>Owner</td><td>Owner</td><td>-</td><td>-</td><td><span class='status s-pend'>PENDING VERIFICATION</span></td></tr></table><p>Overall TAM Status: <span class='status s-part'>PARTIALLY EVALUATED</span>.</p>" },
      { title: "21. Use-Case Test Execution", html: "<p><span class='status s-ver'>VERIFIED</span> 89 Use Cases identified as <strong>Manual Functional Verification Scenarios</strong>. Validated across UI and backend APIs.</p>" },
      { title: "22. Post-Audit Status", html: "<p><span class='status s-ver'>VERIFIED</span> System freezes complete. Option B layout verified. Redundant variables removed.</p>" },
      { title: "23. Technology Stack", html: "<p><span class='status s-impl'>IMPLEMENTED</span> React 18, TypeScript, Vite, TailwindCSS, FastAPI, Python 3.12, PostgreSQL 16, SQLAlchemy, Scikit-Learn.</p>" },
      { title: "24. Frontend Architecture", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Single Page Application utilizing component state and context providers.</p>" },
      { title: "25. Backend Architecture", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Pydantic schema validation, FastAPI routers, and modular monolithic design.</p>" },
      { title: "26. Database Administration", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Managed via Heroku Postgres with automated daily backups.</p>" },
      { title: "27. Data Validation", html: "<p><span class='status s-ver'>VERIFIED</span> Strict typing enforced in UI forms and backend Pydantic models.</p>" },
      { title: "28. Business Rules", html: "<p><span class='status s-ver'>VERIFIED</span> Deterministic math logic governing deposit totals and Official Release Dates.</p>" },
      { title: "29. Reliability & Failure Handling", html: "<p><span class='status s-ver'>VERIFIED</span> 500 error sanitization and 503 fallback mechanisms for database disconnects.</p>" },
      { title: "30. Internet Interruption / Offline Behavior", html: "<p><span class='status s-unv'>NOT IMPLEMENTED</span> System requires an active internet connection. No local caching.</p>" },
      { title: "31. Backup & Recovery", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Manual JSON database export from UI, plus Heroku S3 automated backups.</p>" },
      { title: "32. Data Synchronization", html: "<p><span class='status s-ver'>VERIFIED</span> Synchronous reads/writes to Postgres. No edge caching or multi-master replication needed.</p>" },
      { title: "33. Maintainability", html: "<p><span class='status s-ver'>VERIFIED</span> High maintainability confirmed by IT Experts (3.53/4.00) due to clean file separation.</p>" },
      { title: "34. SOLID / DRY / OOP", html: "<p><span class='status s-ver'>VERIFIED</span> Single Responsibility Principle heavily utilized in FastAPI dependency injection.</p>" },
      { title: "35. Performance Efficiency", html: "<p><span class='status s-ver'>VERIFIED</span> Sub-second response times recorded during IT Expert evaluation (3.73/4.00).</p>" },
      { title: "36. Compatibility & Interaction Capability", html: "<p><span class='status s-ver'>VERIFIED</span> Responsive UI functioning across mobile and desktop interfaces (3.53/4.00).</p>" },
      { title: "37. Safety", html: "<p><span class='status s-ver'>VERIFIED</span> Non-negative constraints and delete confirmations present (3.87/4.00).</p>" },
      { title: "38. Security Threat Model", html: "<p><span class='status s-ver'>VERIFIED</span> Threat modeling mitigates brute force and SQLi, but acknowledges missing MFA.</p>" },
      { title: "39. Testing Strategy", html: "<p><span class='status s-ver'>VERIFIED</span> Bottom-up testing from API routes to full UI workflows.</p>" },
      { title: "40. Use-Case/Test Evidence", html: "<p><span class='status s-ver'>VERIFIED</span> Screenshots and logs present for all 89 manual verification scenarios.</p>" },
      { title: "41. IT Expert Evaluation", html: "<p><span class='status s-eval'>EVALUATED</span> ISO/IEC 25010:2023 instrument executed successfully.</p>" },
      { title: "42. IT Expert Evaluator Profiles", html: "<p><span class='status s-eval'>EVALUATED</span> Evaluator 1: Senior SE. Evaluator 2: Senior DIT. Evaluator 3: QA Lead.</p>" },
      { title: "43. IT Expert Findings", html: "<p><span class='status s-ver'>VERIFIED</span> Option B Turnaround UI and persistent options fully remediated based on feedback.</p>" },
      { title: "44. TAM Evaluation", html: "<p><span class='status s-part'>PARTIALLY EVALUATED</span> Survey covering PU, PEOU, BI, ASU executed for Staff.</p>" },
      { title: "45. TAM Respondent Evidence", html: "<p><span class='status s-eval'>EVALUATED</span> Signed PDF forms for Staff 1 and Joy verified perfectly scoring 4.00.</p>" },
      { title: "46. Questionnaire Validation", html: "<p><span class='status s-eval'>EVALUATED</span> Content Validity Index (0.96) achieved via 4 faculty validators.</p>" },
      { title: "47. Panel Revision Matrix", html: "<p><span class='status s-ver'>VERIFIED</span> Inventory, ROI reports, ML features, and Customer history all fulfilled.</p>" },
      { title: "48. Manuscript Alignment", html: "<p><span class='status s-ver'>VERIFIED</span> 85% claims removed, 5-point scale corrected to 4-point, 5 TAM users corrected to 3.</p>" },
      { title: "49. Objective → Evidence Matrix", html: "<p><span class='status s-ver'>VERIFIED</span> All 5 objectives directly linked to executable code and signed evidence.</p>" },
      { title: "50. Findings & Interpretation", html: "<p><span class='status s-ver'>VERIFIED</span> ML high variance mandates dual-tier architecture. UI speed improves workflow.</p>" },
      { title: "51. Known Limitations", html: "<p><span class='status s-ver'>VERIFIED</span> 35 record dataset. Customer claim delays distort ML target. Requires active internet.</p>" },
      { title: "52. Future Enhancements", html: "<p><span class='status s-ver'>VERIFIED</span> Local SMS integration, 500+ record retraining, offline PWA caching.</p>" },
      { title: "53. Production Deployment", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Deployed on Heroku cloud utilizing Gunicorn process supervisor.</p>" },
      { title: "54. Heroku Configuration", html: "<p><span class='status s-impl'>IMPLEMENTED</span> Heroku-24 Stack. Web Dyno: Basic. Postgres: Essential-0.</p>" },
      { title: "55. Domain & SSL", html: "<p><span class='status s-impl'>IMPLEMENTED</span> `shoelotskey-villamor-pasay.app` registered via Name.com until March 2027. ACM active.</p>" },
      { title: "56. Production Readiness", html: "<p><span class='status s-pend'>PENDING VERIFICATION</span> Awaiting live TAM deployment period to conclude and demo data to be purged.</p>" },
      { title: "57. Maintenance & Handover", html: "<p><span class='status s-part'>PARTIAL</span> Domain and Heroku access transfer plan established for post-defense.</p>" },
      { title: "58. Defense Preparation", html: "<p><span class='status s-ver'>VERIFIED</span> Objective alignment and limitations acknowledged. Option B UI frozen.</p>" },
      { title: "59. Defense Q&A Bank", html: "<p><span class='status s-ver'>VERIFIED</span> Refer to separate SHOELOTSKEY_FINAL_DEFENSE_READINESS_GUIDE.html.</p>" },
      { title: "60. Final Go / No-Go Checklist", html: "<p><span class='status s-pend'>CONDITIONAL GO</span> System is defense ready, but final manuscript chapter 4 requires Owner TAM.</p>" },
      { title: "61. Evidence & Appendices", html: "<p><span class='status s-ver'>VERIFIED</span> Physical binders house signed DPA-compliant forms.</p>" },
      { title: "62. Document Control", html: "<p><span class='status s-ver'>VERIFIED</span> This document officially supersedes all prior architectures and proposals.</p>" }
    ];

    const nav = document.getElementById('nav');
    const content = document.getElementById('content');

    sections.forEach((sec, i) => {
      const a = document.createElement('a');
      a.className = 'nav-link' + (i === 0 ? ' active' : '');
      a.innerText = sec.title;
      a.onclick = () => show(i);
      nav.appendChild(a);

      const div = document.createElement('div');
      div.className = 'section' + (i === 0 ? ' active' : '');
      div.id = 'sec-' + i;
      div.innerHTML = `<h2>${sec.title}</h2>${sec.html}`;
      content.appendChild(div);
    });

    function show(index) {
      document.querySelectorAll('.section').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(e => e.classList.remove('active'));
      document.getElementById('sec-' + index).classList.add('active');
      document.querySelectorAll('.nav-link')[index].classList.add('active');
      document.getElementById('content').scrollTop = 0;
    }

    function search() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.nav-link').forEach((link, i) => {
        const text = sections[i].title.toLowerCase() + " " + sections[i].html.toLowerCase();
        link.style.display = text.includes(q) ? 'block' : 'none';
      });
    }
  </script>
</body>
</html>
